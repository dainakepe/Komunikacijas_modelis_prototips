<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSP komunikācijas modulis</title>
<meta name="description" content="CSP datu vākšanas sistēmas komunikācijas modeļa prototips – saziņa ar respondentiem, veidnes, adresātu saraksti un sūtījumi.">
<style>
/* ===== Krāsu palete =====
   Ekonomikas ministrijas nozares krāsa valsts pārvaldes vienotajā vizuālajā identitātē – “Latvijas kadiķu zaļais”.
   Precīzo HEX vērtību pārbaudiet EM/MK grafiskajā standartā un, ja nepieciešams, nomainiet tikai --g-700 un tā toņus. */
:root{
  --g-950:#0E2F25;
  --g-900:#123B2F;
  --g-800:#174A3B;
  --g-700:#1F5C4A;   /* pamatkrāsa – kadiķu zaļais */
  --g-600:#2B6F5B;
  --g-400:#6E9F8F;
  --g-200:#C5DAD2;
  --g-100:#E3EEE9;
  --g-50:#F1F6F4;
  --carmine:#9E3039; /* Latvijas karmīnsarkanais – akcenti, kļūdas */
  --carmine-50:#F8E9EA;
  --amber:#8A5A00; --amber-50:#FFF3D6;
  --ok:#1E7044; --ok-50:#E4F3EA;
  --info:#24527A; --info-50:#E7EFF7;
  --ink:#1B2623; --ink-2:#3F4E4A; --muted:#66756F;
  --line:#D6DFDB; --line-2:#E8EEEB;
  --bg:#F4F6F5; --surface:#FFFFFF;
  --radius:8px;
  --shadow:0 1px 2px rgba(16,40,32,.06),0 2px 8px rgba(16,40,32,.05);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --font-doc:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg)}
a{color:var(--g-700)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25;color:var(--g-900)}
h1{font-size:24px;font-weight:650}
h2{font-size:18px;font-weight:650}
h3{font-size:15px;font-weight:650}
.flag{height:4px;background:linear-gradient(to bottom,var(--carmine) 0 40%,#fff 40% 60%,var(--carmine) 60% 100%)}

/* ===== Galvene ===== */
.topbar{background:var(--g-800);color:#fff;display:flex;align-items:center;gap:16px;padding:12px 24px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:40px;height:40px;border:2px solid #fff;border-radius:4px;display:grid;place-items:center;font-weight:800;letter-spacing:.5px;font-size:13px;flex:none}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:15px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{display:block;font-size:12.5px;color:var(--g-200);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proto{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:1px;background:#fff;color:var(--g-800);padding:3px 8px;border-radius:3px;flex:none}
.user{font-size:13px;color:var(--g-200);flex:none}

/* ===== Izkārtojums ===== */
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 68px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 10px}
.side .sec{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:12px 12px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-weight:500;margin-bottom:2px}
.nav a:hover{background:var(--g-50);color:var(--g-800)}
.nav a.on{background:var(--g-100);color:var(--g-900);font-weight:650;box-shadow:inset 3px 0 0 var(--g-700)}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
main{padding:24px 28px 48px;min-width:0}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
.crumb a{color:var(--muted)}

/* ===== Elementi ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack>*+*{margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:550;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--g-400);background:var(--g-50)}
.btn.pri{background:var(--g-700);border-color:var(--g-700);color:#fff}
.btn.pri:hover{background:var(--g-800)}
.btn.danger{color:var(--carmine);border-color:#E3C3C6}
.btn.danger:hover{background:var(--carmine-50)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--g-50)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.badge.ok{background:var(--ok-50);color:var(--ok)}
.badge.err{background:var(--carmine-50);color:var(--carmine)}
.badge.warn{background:var(--amber-50);color:var(--amber)}
.badge.info{background:var(--info-50);color:var(--info)}
.badge.g{background:var(--g-100);color:var(--g-800)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}
.nowrap{white-space:nowrap}
.right{text-align:right}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}

/* Formas */
label.f{display:block}
label.f>span{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
label.f>small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
input[type=text],input[type=email],input[type=date],input[type=datetime-local],input[type=search],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;min-height:38px}
textarea{resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible{outline:2px solid var(--g-600);outline-offset:1px;border-color:var(--g-600)}
.invalid{border-color:var(--carmine)!important;background:var(--carmine-50)!important}
.fields{display:grid;gap:14px}
.fields.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.fields .full{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--g-700)}
.radio-card{display:flex;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fff}
.radio-card:hover{border-color:var(--g-400)}
.radio-card.on{border-color:var(--g-700);background:var(--g-50);box-shadow:inset 0 0 0 1px var(--g-700)}
.radio-card input{accent-color:var(--g-700);margin-top:3px}
.radio-card b{display:block}
.radio-card small{color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto;min-width:160px}

/* Tabulas */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:650;background:var(--g-50);white-space:nowrap}
tbody tr:hover{background:#FAFCFB}
tr.sel{background:var(--g-50)}
td .sub{display:block;color:var(--muted);font-size:12.5px}
td.act{white-space:nowrap;text-align:right}
#rtable td:first-child,#w-tbl td:nth-child(2){min-width:220px}

/* Statistika */
.stat{padding:16px 18px}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:550}
.stat .val{font-size:30px;font-weight:700;color:var(--g-900);line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .hint{font-size:13px;color:var(--muted);margin-top:2px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line-2);margin:10px 0 8px}
.bar>i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Vednis */
.steps{display:flex;gap:0;margin-bottom:20px;counter-reset:s;flex-wrap:wrap}
.steps li{list-style:none;flex:1;min-width:130px;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:3px solid var(--line);color:var(--muted);font-weight:550;font-size:14px}
.steps li b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);font-size:12px;color:var(--ink-2);flex:none}
.steps li.done{border-color:var(--g-400);color:var(--g-800)}
.steps li.done b{background:var(--g-400);color:#fff}
.steps li.cur{border-color:var(--g-700);color:var(--g-900)}
.steps li.cur b{background:var(--g-700);color:#fff}
.steps{padding:0;margin-top:0}
.wiz-foot{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}

/* Vietturi */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--g-400);background:var(--g-50);color:var(--g-800);border-radius:4px;padding:3px 8px;font-size:12.5px;cursor:pointer;font-family:ui-monospace,Consolas,monospace}
.chip:hover{background:var(--g-100);border-style:solid}
.ph{background:var(--g-100);color:var(--g-800);border-radius:3px;padding:0 3px}
.ph-miss{background:var(--amber-50);color:var(--amber);border:1px dashed var(--amber);border-radius:3px;padding:0 3px;font-family:ui-monospace,Consolas,monospace;font-size:.9em}

/* Vēstule */
.paper{background:#E9EEEC;padding:20px;border-radius:var(--radius);overflow:auto}
.letter{background:#fff;max-width:720px;margin:0 auto;padding:44px 52px 36px;font-family:var(--font-doc);font-size:14px;line-height:1.55;color:#111;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.lh{text-align:center;padding-bottom:10px;border-bottom:2px solid var(--g-700);margin-bottom:6px}
.lh .em{width:46px;height:46px;margin:0 auto 8px;border:2px solid var(--g-700);border-radius:4px;display:grid;place-items:center;color:var(--g-700);font-weight:800;font-size:13px}
.lh .min{font-size:12px;letter-spacing:1.5px;color:#333}
.lh .inst{font-size:17px;font-weight:700;letter-spacing:1.2px;color:var(--g-800);text-transform:uppercase}
.lh-addr{text-align:center;font-size:11px;color:#444;margin-bottom:26px}
.lmeta{display:flex;justify-content:space-between;gap:16px;font-size:13px;margin-bottom:22px}
.lrecip{margin:0 0 22px auto;max-width:300px;font-size:13.5px}
.lsubj{font-weight:700;font-size:14px;margin:0 0 16px;font-style:italic}
.lbody p{margin:0 0 11px;text-align:justify}
.lsign{display:flex;justify-content:space-between;margin-top:30px;gap:16px}
.lnote{margin-top:36px;text-align:center;font-size:10.5px;letter-spacing:.6px;color:#333;border-top:1px solid #ddd;padding-top:10px}
.lfoot{font-size:11px;color:#555;margin-top:10px}
.mail{background:#fff;max-width:720px;margin:0 auto;font-family:var(--font-doc);font-size:14px;line-height:1.55;color:#111;box-shadow:0 2px 10px rgba(0,0,0,.12);border-radius:6px;overflow:hidden}
.mail-h{background:#F6F8F7;border-bottom:1px solid #E1E7E4;padding:14px 22px;font-size:13px}
.mail-h div{display:flex;gap:8px;padding:2px 0}
.mail-h b{width:62px;color:#555;font-weight:600;flex:none}
.mail-subj{font-size:17px;font-weight:700;padding:16px 22px 0;color:#111}
.mail-b{padding:14px 22px 22px}
.mail-b p{margin:0 0 11px}
.mail-sig{border-top:3px solid var(--g-700);margin-top:18px;padding-top:10px;font-size:13px;color:#333}
.mail-sig b{color:var(--g-800)}
.mail-disc{font-size:11px;color:#777;margin-top:14px}

/* Modālie logi un paziņojumi */
dialog{border:none;border-radius:10px;padding:0;max-width:min(920px,calc(100vw - 24px));width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(14,47,37,.45)}
.dlg-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:#fff;z-index:1}
.dlg-h .x{margin-left:auto}
.dlg-b{padding:20px;max-height:calc(100vh - 180px);overflow:auto}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line-2);background:var(--g-50)}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--g-900);color:#fff;padding:10px 16px;border-radius:6px;box-shadow:var(--shadow);font-size:14px;max-width:360px;animation:tin .2s ease-out}
.toast.err{background:var(--carmine)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.alert{padding:10px 14px;border-radius:6px;font-size:14px;border-left:4px solid}
.alert.warn{background:var(--amber-50);border-color:var(--amber);color:#5C3D00}
.alert.info{background:var(--info-50);border-color:var(--info);color:#16344F}
.alert.ok{background:var(--ok-50);border-color:var(--ok);color:#124A2C}
.alert.err{background:var(--carmine-50);border-color:var(--carmine);color:#5E1B21}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.sticky{position:sticky;top:16px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:550}
.drop{border:2px dashed var(--g-200);border-radius:8px;padding:22px;text-align:center;background:var(--g-50);color:var(--ink-2)}
.drop svg{width:20px;height:20px;vertical-align:-4px}
.drop.over{border-color:var(--g-700);background:var(--g-100)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:none;background:none;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--g-800);border-color:var(--g-700)}
#print-root{display:none}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.sticky{position:static}}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{border-right:none;border-bottom:1px solid var(--line);padding:8px 16px;overflow-x:auto}
  .side .sec{display:none}
  .nav{display:flex;gap:4px}
  .nav a{white-space:nowrap;margin:0}
  .nav a.on{box-shadow:inset 0 -3px 0 var(--g-700)}
  .nav .cnt{display:none}
  main{padding:18px 16px 40px}
  .topbar{padding:10px 16px}
  .user{display:none}
  .g3,.g2,.fields.c2{grid-template-columns:1fr}
  .letter{padding:28px 22px}
  .paper{padding:10px}
}
@media (max-width:520px){.g4{grid-template-columns:1fr}.brand-txt span{display:none}.lmeta{flex-direction:column;gap:2px}}
@media print{
  body.printing>*:not(#print-root){display:none!important}
  body.printing #print-root{display:block}
  body{background:#fff}
  .letter,.mail{box-shadow:none;max-width:none;padding:0}
  .letter{padding:0 8mm}
  @page{size:A4;margin:18mm 16mm}
}
</style>
</head>
<body>
<div class="flag" aria-hidden="true"></div>
<header class="topbar">
  <div class="brand">
    <div class="mark" aria-hidden="true">CSP</div>
    <div class="brand-txt">
      <b>Centrālā statistikas pārvalde</b>
      <span>Datu vākšanas sistēma · Komunikācijas modulis</span>
    </div>
  </div>
  <span class="proto" title="Demonstrācijas prototips – vēstules netiek reāli nosūtītas">PROTOTIPS</span>
  <span class="user">Lietotājs: Respondentu atbalsta speciālists</span>
</header>
<div class="layout">
  <aside class="side">
    <div class="sec">Komunikācija</div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="dlg"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="print-root"></div>

<script>
"use strict";
/* ================= Dati un krātuve ================= */
const KEY = "csp-komunikacija-v1";
const TIPS = ["Paziņojums par iekļaušanu apsekojumā","Atgādinājums","Brīdinājums par neiesniegtu pārskatu","Pateicība","Cits"];
const KANALI = {"e-adrese":"E-adrese (oficiāla vēstule)","e-pasts":"E-pasts","abi":"E-adrese un e-pasts"};
const STRATEGIJAS = {
  prioritate:{t:"E-adrese prioritāra",d:"Sūta uz e-adresi; ja tās nav – uz e-pastu."},
  eadrese:{t:"Tikai e-adrese",d:"Respondenti bez e-adreses tiks izslēgti."},
  epasts:{t:"Tikai e-pasts",d:"Respondenti bez e-pasta tiks izslēgti."},
  abi:{t:"Abi kanāli",d:"Sūta uz visiem pieejamajiem kanāliem."}
};
const PH = [
  ["nosaukums","Respondenta nosaukums"],["reg_nr","Reģistrācijas Nr."],["kontaktpersona","Kontaktpersona"],["adrese","Juridiskā adrese"],
  ["apsekojums","Apsekojuma nosaukums"],["apsekojuma_kods","Apsekojuma kods"],["periods","Pārskata periods"],["termins","Iesniegšanas termiņš"],
  ["datums","Vēstules datums"],["vestules_nr","Vēstules numurs"],["iestade","Iestāde"],["talrunis","Iestādes tālrunis"],
  ["iestades_epasts","Iestādes e-pasts"],["paraksttajs","Parakstītājs"],["amats","Parakstītāja amats"]
];
const MENESI = ["janvārī","februārī","martā","aprīlī","maijā","jūnijā","jūlijā","augustā","septembrī","oktobrī","novembrī","decembrī"];

function seed(){
  const now = new Date().toISOString();
  const T = (nosaukums,tips,kanals,temats,saturs,statuss="Apstiprināta") => ({id:uid(),nosaukums,tips,kanals,temats,saturs,statuss,versija:1,updated:now});
  return {
    seq: 0,
    settings:{
      iestade:"Centrālā statistikas pārvalde",
      ministrija:"Ekonomikas ministrija",
      adrese:"Lāčplēša iela 1, Rīga, LV-1301",
      reg_nr:"90000052075",
      talrunis:"67366850",
      epasts:"csp@csp.gov.lv",
      vietne:"www.csp.gov.lv",
      e_adrese:"_DEFAULT@90000052075",
      paraksttajs:"Vārds Uzvārds",
      amats:"Datu vākšanas daļas vadītāja",
      nrPrefikss:"2.1-7/",
      sutitajs:"CSP Respondentu atbalsts"
    },
    surveys:[
      {kods:"1-apgrozījums",nosaukums:"Mēneša pārskats par apgrozījumu"},
      {kods:"2-darbs",nosaukums:"Ceturkšņa pārskats par darbu"},
      {kods:"1-IT",nosaukums:"Informācijas un komunikācijas tehnoloģiju izmantošana uzņēmumos"},
      {kods:"1-investīcijas",nosaukums:"Pārskats par ilgtermiņa ieguldījumiem"}
    ],

/* ---- CSV ---- */
function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||"";
  const delim=[";",",","\t"].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c; }
    else if(c==='"') q=true;
    else if(c===delim){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n")i++; row.push(f);rows.push(row);row=[];f=""; }
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function norm(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"")}
const COLMAP={
  nosaukums:["nosaukums","name","uznemums","respondents","respondenta nosaukums"],
  reg_nr:["reg_nr","regnr","registracijas nr","registracijas numurs","reg nr","registration"],
  kontaktpersona:["kontaktpersona","kontakts","contact","kontaktpersonas vards"],
  adrese:["adrese","juridiska adrese","address","pasta adrese"],
  e_adrese:["e_adrese","eadrese","e-adrese","oficiala elektroniska adrese"],
  e_pasts:["e_pasts","epasts","e-pasts","email","e-mail","epasta adrese"],
  talrunis:["talrunis","telefons","phone","talr"],
  apsekojumi:["apsekojumi","apsekojums","apsekojuma kods","survey","apsekojumu kodi"]
};
function mapHeader(h){const n=norm(h);for(const[k,al]of Object.entries(COLMAP)) if(al.some(a=>norm(a)===n))return k;return null}
function csvCell(v){v=String(v??"");return /[";\n\r]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}
function toCSV(header,rows){return "﻿"+[header,...rows].map(r=>r.map(csvCell).join(";")).join("\r\n")}

function analyzeImport(text){
  const rows=parseCSV(text);
  if(rows.length<2){$("#imp-prev").innerHTML=`<div class="alert err">Nav atrasti dati – nepieciešama galvenes rinda un vismaz viena datu rinda.</div>`;$("#impGo").disabled=true;return}
  const map=rows[0].map(mapHeader);
  if(!map.includes("nosaukums")){$("#imp-prev").innerHTML=`<div class="alert err">Neatpazīta kolonna “nosaukums”. Atrastās kolonnas: ${rows[0].map(esc).join(", ")}</div>`;$("#impGo").disabled=true;return}
  const unknown=rows[0].filter((h,i)=>!map[i]);
  const known=new Set(S.surveys.map(s=>s.kods));
  const seen=new Set();
  const items=rows.slice(1).map(cells=>{
    const d={nosaukums:"",reg_nr:"",kontaktpersona:"",adrese:"",e_adrese:"",e_pasts:"",talrunis:"",apsekojumi:[]};
    map.forEach((k,i)=>{if(!k)return;const v=(cells[i]||"").trim();if(k==="apsekojumi")d.apsekojumi=v.split(/[|,]/).map(s=>s.trim()).filter(Boolean);else d[k]=v});
    const errs=[],warns=[];
    if(!d.nosaukums)errs.push("Nav nosaukuma");
    if(d.reg_nr&&!/^\d{11}$/.test(d.reg_nr))warns.push("Reģ. Nr. nav 11 cipari");
    if(!validEmail(d.e_pasts))errs.push("Nederīgs e-pasts");
    if(!validEadrese(d.e_adrese))warns.push("Neparasts e-adreses formāts");
    if(!d.e_adrese&&!d.e_pasts)warns.push("Nav saziņas kanāla");
    if(d.reg_nr&&seen.has(d.reg_nr))errs.push("Dublikāts failā");
    if(d.reg_nr)seen.add(d.reg_nr);
    d.apsekojumi.filter(k=>!known.has(k)).forEach(k=>warns.push(`Jauns apsekojums “${k}”`));
    const ex=d.reg_nr?S.respondents.find(r=>r.reg_nr===d.reg_nr):null;
    return {d,errs,warns,ex};
  });
  IMPORT=items;
  const okN=items.filter(i=>!i.errs.length).length, upd=items.filter(i=>!i.errs.length&&i.ex).length;
  $("#imp-prev").innerHTML=`
    <div class="alert ${items.length-okN?"warn":"ok"}">Atrastas ${items.length} rindas: <b>${okN-upd}</b> jauni, <b>${upd}</b> atjaunināmi, <b>${items.length-okN}</b> ar kļūdām (netiks importēti).${unknown.length?`<br>Ignorētās kolonnas: ${unknown.map(esc).join(", ")}`:""}</div>
    <div class="tbl-wrap" style="margin-top:10px;max-height:300px;overflow:auto"><table><thead><tr><th>Nosaukums</th><th>Reģ. Nr.</th><th>E-adrese</th><th>E-pasts</th><th>Rezultāts</th></tr></thead><tbody>
    ${items.map(i=>`<tr><td>${esc(i.d.nosaukums||"—")}</td><td class="mono">${esc(i.d.reg_nr)}</td><td class="mono">${esc(i.d.e_adrese)}</td><td>${esc(i.d.e_pasts)}</td>
      <td>${i.errs.length?`<span class="badge err">${esc(i.errs.join("; "))}</span>`:`<span class="badge ${i.ex?"info":"ok"}">${i.ex?"Atjaunināt":"Jauns"}</span>`}${i.warns.length?`<span class="sub" style="color:var(--amber)">${esc(i.warns.join("; "))}</span>`:""}</td></tr>`).join("")}
    </tbody></table></div>`;
  $("#impGo").disabled=!okN;
  $("#impGo").textContent=`Importēt ${okN} ierakstus`;
}
function doImport(){
  if(!IMPORT)return;
  let n=0,u=0;
  IMPORT.filter(i=>!i.errs.length).forEach(({d,ex})=>{
    d.apsekojumi.forEach(k=>{if(!survey(k))S.surveys.push({kods:k,nosaukums:k})});
    if(ex){Object.assign(ex,d);u++} else {S.respondents.push({id:uid(),...d,piezimes:"",created:new Date().toISOString()});n++}
  });
  save();closeDialog();toast(`Importēts: ${n} jauni, ${u} atjaunināti.`);route();
}

function saveTemplate(){
  const errs=[];
  if(!TE.nosaukums.trim())errs.push("Norādiet veidnes nosaukumu.");
  if(!TE.temats.trim())errs.push("Norādiet tematu.");
  if(!TE.saturs.trim())errs.push("Vēstules teksts nedrīkst būt tukšs.");
  const unknown=missing(TE.temats+" "+TE.saturs).filter(k=>!PH.some(p=>p[0]===k));
  if(unknown.length)errs.push("Nezināmi mainīgie lauki: "+unknown.map(k=>`{{${k}}}`).join(", "));
  if(errs.length){$("#tf-err").innerHTML=`<div class="alert err">${errs.map(esc).join("<br>")}</div>`;return}
  const fields={nosaukums:TE.nosaukums.trim(),tips:TE.tips,kanals:TE.kanals,temats:TE.temats,saturs:TE.saturs,statuss:TE.statuss};
  if(TE.id){
    const t=tpl(TE.id);
    const changed=t.temats!==fields.temats||t.saturs!==fields.saturs;
    Object.assign(t,fields,{versija:t.versija+(changed?1:0),updated:new Date().toISOString()});

function wizFwd(){
  const msg=t=>{$("#w-msg").textContent=t;$("#w-msg").style.color="var(--carmine)"};
  if(W.step===1){ if(!W.templateId)return msg("Izvēlieties veidni."); if(!W.surveyKod)return msg("Izvēlieties apsekojumu."); }
  if(W.step===2 && !W.selected.size) return msg("Atlasiet vismaz vienu respondentu.");
  if(W.step===3 && !wizPlan().some(p=>p.ch.length)) return msg("Nevienam atlasītajam respondentam nav pieejama kanāla.");
  if(W.step===5) return sendCampaign();
  W.step++; if(W.step===4)W.pi=0; route(); window.scrollTo(0,0);
}
function simulateDelivery(m,r){
  if(m.kanals==="e-pasts"){ if(!validEmail(r.e_pasts)) return ["Kļūda","Nederīga e-pasta adrese – vēstule netika nosūtīta."]; return ["Nosūtīts","Nodots e-pasta serverim."]; }
  if(!validEadrese(r.e_adrese)) return ["Kļūda","E-adrese nav atrasta vai nav aktivizēta."];
  return ["Piegādāts","Piegādāts e-adreses kontā."];
}
function sendCampaign(){
  const t=tpl(W.templateId);
  if(W.schedule && (!W.scheduledAt||new Date(W.scheduledAt)<=new Date())) { $("#w-msg").textContent="Norādiet nākotnes laiku."; $("#w-msg").style.color="var(--carmine)"; return; }
  const plan=wizPlan().filter(p=>p.ch.length);
  const when=W.schedule?new Date(W.scheduledAt).toISOString():new Date().toISOString();
  const c={id:uid(),created:new Date().toISOString(),scheduledAt:W.schedule?when:null,templateId:t.id,
    template:{nosaukums:t.nosaukums,versija:t.versija,tips:t.tips},surveyKod:W.surveyKod,periods:W.periods,termins:W.termins,strategy:W.strategy,messages:[]};
  plan.forEach(p=>p.ch.forEach(ch=>{
    const nr=S.settings.nrPrefikss+(++S.seq);
    const m=composeMessage(t,p.r,{...W,datums:when},ch,nr);
    const [st,info]=W.schedule?["Ieplānots","Gaida nosūtīšanas laiku."]:simulateDelivery(m,p.r);
    c.messages.push({id:uid(),respondentId:p.r.id,...m,statuss:st,info,datums:when});
  }));
  S.campaigns.push(c); save();
  toast(W.schedule?`Sūtījums ieplānots: ${dTime(when)}.`:`Nosūtītas ${c.messages.length} vēstules.`);
  resetWizard(); go("#/vesture/"+c.id);
}
function processScheduled(){
  let ch=false; const now=new Date();
  S.campaigns.forEach(c=>{ if(c.scheduledAt && new Date(c.scheduledAt)<=now){ c.messages.forEach(m=>{ if(m.statuss==="Ieplānots"){ const r=resp(m.respondentId)||{e_pasts:m.adrese,e_adrese:m.adrese}; [m.statuss,m.info]=simulateDelivery(m,r); ch=true; } }); } });
  if(ch)save();
}

function campaignTable(list){
  return `<div class="tbl-wrap"><table><thead><tr><th>Datums</th><th>Veidne</th><th>Apsekojums / periods</th><th class="right">Vēstules</th><th>Rezultāts</th><th></th></tr></thead><tbody>
  ${list.map(c=>{const s=cStats(c);return `<tr><td class="nowrap">${dTime(c.scheduledAt||c.created)}</td><td><b>${esc(c.template.nosaukums)}</b><span class="sub">v${c.template.versija}</span></td>
    <td>${esc(c.surveyKod)}<span class="sub">${esc(c.periods||"")}</span></td><td class="right">${s.n}</td>
    <td class="nowrap">${s.pl?statusBadge("Ieplānots"):`<span class="badge ok">${s.ok} piegādātas</span>`} ${s.err?`<span class="badge err">${s.err} kļūdas</span>`:""}</td>
    <td class="act"><a class="btn sm" href="#/vesture/${c.id}">Atvērt</a></td></tr>`}).join("")}</tbody></table></div>`;
}
function vHistory(){
  const list=[...S.campaigns].sort((a,b)=>b.created.localeCompare(a.created));
  return `<div class="page-head"><div><h1>Sūtījumu vēsture</h1><p>Visi sagatavotie un nosūtītie sūtījumi ar piegādes statusiem.</p></div>
    <div class="actions"><a class="btn pri" href="#/sutijums">${icon("send")}Jauns sūtījums</a></div></div>
    <div class="card">${list.length?campaignTable(list):`<div class="empty">Vēl nav neviena sūtījuma.</div>`}</div>`;
}
let CF="";
function vCampaign(id){
  const c=S.campaigns.find(x=>x.id===id); if(!c)return `<div class="empty">Sūtījums nav atrasts. <a href="#/vesture">Atpakaļ</a></div>`;
  const s=cStats(c), sv=survey(c.surveyKod);
  return `<div class="page-head"><div><div class="crumb"><a href="#/vesture">Sūtījumu vēsture</a> /</div><h1>${esc(c.template.nosaukums)}</h1><p>${c.scheduledAt&&s.pl?"Ieplānots":"Nosūtīts"} ${dTime(c.scheduledAt||c.created)} · ${esc(c.surveyKod)} · ${esc(c.periods||"")}</p></div>
    <div class="actions">${s.err?`<button class="btn" data-act="retry" data-id="${c.id}">Sūtīt atkārtoti kļūdainās</button>`:""}${s.pl?`<button class="btn danger" data-act="cancelSched" data-id="${c.id}">Atcelt ieplānoto</button>`:""}<button class="btn" data-act="exportCamp" data-id="${c.id}">${icon("down")}Atskaite CSV</button></div></div>
  <div class="grid g4">
    <div class="card stat"><div class="lbl">Vēstules</div><div class="val">${s.n}</div><div class="hint">${c.messages.filter(m=>m.kanals==="e-adrese").length} e-adresē · ${c.messages.filter(m=>m.kanals==="e-pasts").length} e-pastā</div></div>
    <div class="card stat"><div class="lbl">Piegādātas / nosūtītas</div><div class="val" style="color:var(--ok)">${s.ok}</div></div>
    <div class="card stat"><div class="lbl">Kļūdas</div><div class="val" style="${s.err?"color:var(--carmine)":""}">${s.err}</div></div>
    <div class="card stat"><div class="lbl">Apsekojums</div><div class="val" style="font-size:18px;margin-top:8px">${esc(c.surveyKod)}</div><div class="hint">${esc(sv?.nosaukums||"")}</div></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-h"><h2>Vēstules</h2><div class="r"><select id="cf" style="width:auto" aria-label="Statuss">${[["","Visi statusi"],["Piegādāts","Piegādāts"],["Nosūtīts","Nosūtīts"],["Kļūda","Kļūda"],["Ieplānots","Ieplānots"]].map(([v,t])=>`<option value="${v}" ${CF===v?"selected":""}>${t}</option>`).join("")}</select></div></div>
    <div class="tbl-wrap" id="ctbl"></div></div>`;
}
function bindCampaign(){
  const id=location.hash.split("/")[2]; const c=S.campaigns.find(x=>x.id===id); if(!c)return;
  const draw=()=>{const list=c.messages.filter(m=>!CF||m.statuss===CF);
    $("#ctbl").innerHTML=list.length?`<table><thead><tr><th>Nr.</th><th>Respondents</th><th>Kanāls / adrese</th><th>Statuss</th><th></th></tr></thead><tbody>
    ${list.map(m=>`<tr><td class="mono nowrap">${esc(m.nr)}</td><td><b>${esc(m.nosaukums)}</b><span class="sub">${esc(m.kontaktpersona||"")}</span></td>
      <td>${m.kanals==="e-pasts"?"E-pasts":"E-adrese"}<span class="sub mono">${esc(m.adrese)}</span></td><td>${statusBadge(m.statuss)}<span class="sub">${esc(m.info||"")}</span></td>
      <td class="act"><button class="btn sm" data-act="viewMsg" data-c="${c.id}" data-id="${m.id}">Skatīt</button></td></tr>`).join("")}</tbody></table>`:`<div class="empty">Nav vēstuļu ar šādu statusu.</div>`};
  $("#cf").addEventListener("change",e=>{CF=e.target.value;draw()}); draw();
}
function findMsg(cid,mid){const c=S.campaigns.find(x=>x.id===cid);return c?{c,m:c.messages.find(x=>x.id===mid)}:{}}
function viewMessage(cid,mid){
  const {m}=findMsg(cid,mid); if(!m)return;
  openDialog(`${esc(m.nr)} · ${esc(m.nosaukums)}`,`<div style="margin-bottom:12px">${statusBadge(m.statuss)} <span class="small muted">${esc(m.info||"")} · ${dTime(m.datums)}</span></div><div class="paper">${letterHTML(m)}</div>`,
   `${m.kanals==="e-pasts"?`<button class="btn" data-act="eml" data-c="${cid}" data-id="${mid}">${icon("down")}Lejupielādēt .eml</button>`:""}<button class="btn" data-act="printMsg" data-c="${cid}" data-id="${mid}">${icon("print")}Drukāt / PDF</button><button class="btn pri" data-act="closeDlg">Aizvērt</button>`);
}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function downloadEml(cid,mid){
  const {m}=findMsg(cid,mid); const st=S.settings;
  const eml=[`From: =?UTF-8?B?${b64(st.sutitajs)}?= <${st.epasts}>`,`To: =?UTF-8?B?${b64(m.kontaktpersona||m.nosaukums)}?= <${m.adrese}>`,`Subject: =?UTF-8?B?${b64(m.temats)}?=`,
    `Date: ${new Date(m.datums).toUTCString()}`,"MIME-Version: 1.0","Content-Type: text/plain; charset=UTF-8","Content-Transfer-Encoding: base64","",
    b64(`${m.saturs}\n\n--\n${st.iestade}\n${st.adrese}\nTālr. ${st.talrunis} · ${st.epasts}`).replace(/.{76}/g,"$&\r\n")].join("\r\n");
  download(`${m.nr.replace(/[^\w.-]+/g,"_")}.eml`,eml,"message/rfc822");
}
function printMessage(cid,mid){
  const {m}=findMsg(cid,mid); $("#print-root").innerHTML=letterHTML(m);
  closeDialog(); document.body.classList.add("printing");
  setTimeout(()=>{window.print();document.body.classList.remove("printing")},50);
}
function exportCampaign(id){
  const c=S.campaigns.find(x=>x.id===id);
  download(`sutijums_${dShort(c.created).replace(/\./g,"")}_${c.surveyKod}.csv`,toCSV(["vestules_nr","respondents","kontaktpersona","kanals","adrese","temats","statuss","informacija","datums"],
    c.messages.map(m=>[m.nr,m.nosaukums,m.kontaktpersona,m.kanals,m.adrese,m.temats,m.statuss,m.info,dTime(m.datums)])),"text/csv;charset=utf-8");
}
function retryFailed(id){
  const c=S.campaigns.find(x=>x.id===id); let ok=0,still=0;
  c.messages.filter(m=>m.statuss==="Kļūda").forEach(m=>{
    const r=resp(m.respondentId); if(!r){still++;return}
    m.adrese=m.kanals==="e-pasts"?r.e_pasts:r.e_adrese;
    [m.statuss,m.info]=simulateDelivery(m,r); m.statuss==="Kļūda"?still++:ok++;
    if(m.statuss!=="Kļūda") m.info+=" (atkārtoti)";
  });
  save(); toast(still?`Atkārtoti nosūtītas ${ok}; ${still} joprojām ar kļūdu – labojiet respondentu adreses.`:`Visas ${ok} vēstules nosūtītas atkārtoti.`,!!still); route();
}

/* ================= Iestatījumi ================= */
function vSettings(){
  const st=S.settings;
  const F=(k,l,h="")=>`<label class="f"><span>${l}</span><input type="text" data-set="${k}" value="${esc(st[k])}">${h?`<small>${h}</small>`:""}</label>`;
  return `<div class="page-head"><div><h1>Iestatījumi</h1><p>Iestādes rekvizīti vēstulēm, apsekojumu klasifikators un datu pārvaldība.</p></div></div>
  <div class="grid g2">
    <div class="card"><div class="card-h"><h2>Iestādes rekvizīti</h2></div><div class="card-b fields c2">
      ${F("iestade","Iestāde")}${F("ministrija","Padotībā")}${F("adrese","Adrese")}${F("reg_nr","Reģistrācijas Nr.")}${F("talrunis","Tālrunis")}${F("epasts","E-pasts")}${F("vietne","Tīmekļvietne")}${F("e_adrese","Iestādes e-adrese")}
      ${F("paraksttajs","Parakstītājs")}${F("amats","Parakstītāja amats")}${F("nrPrefikss","Vēstules numura prefikss","Piem., 2.1-7/ → 2.1-7/15")}${F("sutitajs","E-pasta sūtītāja vārds")}
      <div class="full"><button class="btn pri" data-act="saveSettings">Saglabāt rekvizītus</button></div></div></div>
    <div class="stack">
      <div class="card"><div class="card-h"><h2>Apsekojumi</h2></div>
        <div class="tbl-wrap"><table><thead><tr><th>Kods</th><th>Nosaukums</th><th></th></tr></thead><tbody>
        ${S.surveys.map(s=>`<tr><td class="nowrap"><b>${esc(s.kods)}</b></td><td>${esc(s.nosaukums)}</td><td class="act"><button class="btn sm ghost" data-act="delSurvey" data-id="${esc(s.kods)}" aria-label="Dzēst">${icon("x")}</button></td></tr>`).join("")}
        </tbody></table></div>
        <div class="card-b toolbar" style="border-top:1px solid var(--line-2)"><input type="text" id="ns-k" placeholder="Kods" style="max-width:150px"><input type="text" id="ns-n" placeholder="Nosaukums" style="flex:1;min-width:160px"><button class="btn" data-act="addSurvey">${icon("plus")}Pievienot</button></div></div>
      <div class="card"><div class="card-h"><h2>Dati</h2></div><div class="card-b stack">
        <p class="small muted" style="margin:0">Prototips glabā datus tikai šajā pārlūkā (localStorage). Lai pārnestu datus uz citu datoru, izmantojiet eksportu.</p>
        <div class="toolbar"><button class="btn" data-act="exportAll">${icon("down")}Eksportēt visus datus (JSON)</button>
          <label class="btn">${icon("up")}Importēt JSON<input type="file" id="impAll" accept=".json,application/json" hidden></label>
          <button class="btn danger" data-act="resetAll">Atjaunot demonstrācijas datus</button></div></div></div>
    </div></div>`;
}

/* ================= Dialogs ================= */
function openDialog(title,body,foot){
  const d=$("#dlg");
  d.innerHTML=`<div class="dlg-h"><h2>${title}</h2><button class="btn ghost sm x" data-act="closeDlg" aria-label="Aizvērt">${icon("x")}</button></div><div class="dlg-b">${body}</div>${foot?`<div class="dlg-f">${foot}</div>`:""}`;
  if(!d.open)d.showModal();
  $$(".tabs button",d).forEach(b=>b.addEventListener("click",()=>{$$(".tabs button",d).forEach(x=>x.classList.toggle("on",x===b));$$("[data-tabp]",d).forEach(p=>p.hidden=p.dataset.tabp!==b.dataset.tab);$(".dlg-f",d).style.display=b.dataset.tab==="pr"?"":"none"}));
}
function closeDialog(){const d=$("#dlg");if(d.open)d.close()}

/* ================= Darbības ================= */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el)return;
  const a=el.dataset.act, id=el.dataset.id;
  if(el.tagName==="A"&&el.getAttribute("href")==="#")e.preventDefault();
  switch(a){
    case "closeDlg": closeDialog(); break;
    case "editResp": openRespondent(id); break;
    case "saveResp": saveRespondent(id||null); break;
    case "delResp": if(confirm("Dzēst šo respondentu? Sūtījumu vēsture tiks saglabāta.")){S.respondents=S.respondents.filter(r=>r.id!==id);save();closeDialog();toast("Respondents dzēsts.");route()} break;
    case "exportResp": exportRespondents(); break;
    case "importResp": openImport(); break;
    case "sampleCsv": sampleCsv(); break;
    case "parseImport": analyzeImport($("#paste").value); break;
    case "doImport": doImport(); break;
    case "saveTpl": saveTemplate(); break;
    case "delTpl": if(confirm("Dzēst veidni? Iepriekšējie sūtījumi netiks ietekmēti.")){S.templates=S.templates.filter(t=>t.id!==id);save();toast("Veidne dzēsta.");go("#/veidnes")} break;
    case "dupTpl": {const t=tpl(id);const n={...t,id:uid(),nosaukums:t.nosaukums+" (kopija)",statuss:"Melnraksts",versija:1,updated:new Date().toISOString()};S.templates.push(n);save();go("#/veidnes/"+n.id);toast("Izveidota veidnes kopija.");break}
    case "useTpl": resetWizard(id); go("#/sutijums"); break;
    case "wizFwd": wizFwd(); break;
    case "wizBack": W.step=Math.max(1,W.step-1); route(); break;
    case "wizReset": resetWizard(); route(); break;
    case "wizAll": W._visible.forEach(i=>W.selected.add(i)); renderWizTable(); break;
    case "wizNone": W.selected.clear(); renderWizTable(); break;
    case "wizPrev": W.pi--; route(); break;
    case "wizNext": W.pi++; route(); break;
    case "wizJump": W.pi=+el.dataset.i; route(); break;
    case "viewMsg": viewMessage(el.dataset.c,id); break;
    case "eml": downloadEml(el.dataset.c,id); break;
    case "printMsg": printMessage(el.dataset.c,id); break;
    case "exportCamp": exportCampaign(id); break;
    case "retry": retryFailed(id); break;
    case "cancelSched": if(confirm("Atcelt ieplānoto sūtījumu?")){S.campaigns=S.campaigns.filter(c=>c.id!==id);save();toast("Ieplānotais sūtījums atcelts.");go("#/vesture")} break;
    case "saveSettings": $$("[data-set]").forEach(i=>S.settings[i.dataset.set]=i.value.trim()); save(); toast("Rekvizīti saglabāti."); break;
    case "addSurvey": {const k=$("#ns-k").value.trim(),n=$("#ns-n").value.trim(); if(!k||!n)return toast("Norādiet kodu un nosaukumu.",true); if(survey(k))return toast("Šāds kods jau eksistē.",true); S.surveys.push({kods:k,nosaukums:n});save();route();break}
    case "delSurvey": {const used=S.respondents.filter(r=>(r.apsekojumi||[]).includes(id)).length; if(confirm(used?`Apsekojums piesaistīts ${used} respondentiem. Dzēst un noņemt piesaisti?`:"Dzēst apsekojumu?")){S.surveys=S.surveys.filter(s=>s.kods!==id);S.respondents.forEach(r=>r.apsekojumi=(r.apsekojumi||[]).filter(k=>k!==id));save();route()} break}
    case "exportAll": download(`csp_komunikacija_${dShort(new Date()).replace(/\./g,"")}.json`,JSON.stringify(S,null,2),"application/json"); break;
    case "resetAll": if(confirm("Visi pašreizējie dati tiks aizstāti ar demonstrācijas datiem. Turpināt?")){S=seed();save();resetWizard();toast("Demonstrācijas dati atjaunoti.");route()} break;
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="impAll"&&e.target.files[0]){
    const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.respondents||!d.templates)throw 0;S=d;save();resetWizard();toast("Dati importēti.");route()}catch(err){toast("Nederīgs datu fails.",true)}};fr.readAsText(e.target.files[0]);
  }
});
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")closeDialog()});
route();
setInterval(()=>{const before=JSON.stringify(S.campaigns.map(c=>c.messages.map(m=>m.statuss)));processScheduled();if(JSON.stringify(S.campaigns.map(c=>c.messages.map(m=>m.statuss)))!==before&&!$("#dlg").open)route()},30000);
</script>
</body>
</html>
